name: "A1 Chess — Quick Build APK"

on:
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  build_apk:
    name: Build APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-v1-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-v1-

      - name: Disable Firebase symbol upload
        run: |
          {
            echo "com.google.firebase.crashlytics.mappingfileupload.enabled=false"
            echo "com.google.firebase.crashlytics.unstrippednativelibs.enabled=false"
          } >> android/gradle.properties

      - name: Install pub dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build

      - name: Generate signing keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/keystore.jks \
            -alias rdchess \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass rdchess2024 -keypass rdchess2024 \
            -dname "CN=A1Chess, OU=RD, O=Ryzix, L=City, ST=State, C=US"
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=rdchess2024"
            echo "keyAlias=rdchess"
            echo "keyPassword=rdchess2024"
          } > android/key.properties

      - name: Build arm64 release APK
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --obfuscate \
            --split-debug-info=build/debug-info/arm64
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/a1chess-arm64.apk
          echo "════════ APK size ════════"
          ls -lh build/app/outputs/flutter-apk/a1chess-arm64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: A1Chess-arm64-APK
          path: build/app/outputs/flutter-apk/a1chess-arm64.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v1.1.0
          name: "A1 Chess v1.1.0"
          body: |
            Signed arm64 APK — Stockfish downloads automatically on first launch.
            Install, open the app, and Stockfish will download in the background.
          files: build/app/outputs/flutter-apk/a1chess-arm64.apk
          token: ${{ secrets.GITHUB_TOKEN }}

name: "A1 Chess — Quick Build APK"

on:
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write

jobs:
  build_apk:
    name: Build APKs (arm64 + arm32)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-v1-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-v1-

      # ── Version bump ────────────────────────────────────────────────────
      - name: Bump build number
        id: bump
        run: |
          current=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          version_name=$(echo "$current" | cut -d'+' -f1)
          build_num=$(echo "$current" | cut -d'+' -f2)
          new_build=$(printf "%06d" $(( 10#$build_num + 1 )))
          new_version="${version_name}+${new_build}"
          sed -i "s/^version: .*/version: $new_version/" pubspec.yaml
          echo "version=$new_version"         >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name"   >> "$GITHUB_OUTPUT"
          echo "Bumped: $current → $new_version"

      - name: Commit bumped version
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump build number to ${{ steps.bump.outputs.version }} [skip ci]" || echo "Nothing to commit"
          git push

      # ── Build setup ─────────────────────────────────────────────────────
      - name: Disable Firebase symbol upload
        run: |
          {
            echo "com.google.firebase.crashlytics.mappingfileupload.enabled=false"
            echo "com.google.firebase.crashlytics.unstrippednativelibs.enabled=false"
          } >> android/gradle.properties

      - name: Install pub dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build

      - name: Generate signing keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/keystore.jks \
            -alias rdchess \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass rdchess2024 -keypass rdchess2024 \
            -dname "CN=A1Chess, OU=RD, O=Ryzix, L=City, ST=State, C=US"
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=rdchess2024"
            echo "keyAlias=rdchess"
            echo "keyPassword=rdchess2024"
          } > android/key.properties

      # ── Builds ──────────────────────────────────────────────────────────
      - name: Build arm64-v8a APK (Redmi 12C)
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --obfuscate \
            --split-debug-info=build/debug-info/arm64
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/a1chess-v${{ steps.bump.outputs.version_name }}-arm64.apk

      - name: Build armeabi-v7a APK (Poco C3)
        run: |
          flutter build apk --release \
            --target-platform android-arm \
            --obfuscate \
            --split-debug-info=build/debug-info/arm32
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/a1chess-v${{ steps.bump.outputs.version_name }}-arm32.apk

      - name: Report APK sizes
        run: |
          echo "════════ APK sizes ════════"
          ls -lh build/app/outputs/flutter-apk/a1chess-*.apk

      # ── Artifacts & Release ─────────────────────────────────────────────
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v7
        with:
          name: A1Chess-v${{ steps.bump.outputs.version_name }}-APKs
          path: build/app/outputs/flutter-apk/a1chess-*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.bump.outputs.version_name }}-build.${{ github.run_number }}
          name: "A1 Chess v${{ steps.bump.outputs.version_name }} (Build #${{ github.run_number }})"
          body: |
            ## A1 Chess v${{ steps.bump.outputs.version_name }}

            ### Download
            | APK | Device |
            |-----|--------|
            | `a1chess-*-arm64.apk` | **Redmi 12C** (64-bit) |
            | `a1chess-*-arm32.apk` | **Poco C3** (32-bit)   |
          files: build/app/outputs/flutter-apk/a1chess-*.apk
          token: ${{ secrets.GITHUB_TOKEN }}

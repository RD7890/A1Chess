name: "A1 Chess — Quick Build APK"

on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write

jobs:
  build_apk:
    name: Build APK (arm64)
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-v1-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-v1-

      - name: Disable Firebase symbol upload (no credentials in CI)
        run: |
          {
            echo "com.google.firebase.crashlytics.mappingfileupload.enabled=false"
            echo "com.google.firebase.crashlytics.unstrippednativelibs.enabled=false"
          } >> android/gradle.properties

      - name: Install pub dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Stage Stockfish 17.1 (arm64-v8a dotprod)
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a /tmp/sf17-arm64
          curl -fsSL \
            "https://github.com/official-stockfish/Stockfish/releases/download/sf_17.1/stockfish-android-armv8-dotprod.tar" \
            -o /tmp/sf17-arm64.tar
          tar -xf /tmp/sf17-arm64.tar -C /tmp/sf17-arm64
          find /tmp/sf17-arm64 -name "stockfish-android-armv8-dotprod" -exec \
            cp {} android/app/src/main/jniLibs/arm64-v8a/libstockfish17.so \;
          echo "SF17.1 staged: $(ls -lh android/app/src/main/jniLibs/arm64-v8a/libstockfish17.so)"

      - name: Generate release signing keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/keystore.jks \
            -alias rdchess \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass rdchess2024 -keypass rdchess2024 \
            -dname "CN=A1Chess, OU=RD, O=Ryzix, L=City, ST=State, C=US"
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=rdchess2024"
            echo "keyAlias=rdchess"
            echo "keyPassword=rdchess2024"
          } > android/key.properties
          echo "Keystore generated ✓"

      - name: Build arm64-v8a release APK
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --obfuscate \
            --split-debug-info=build/debug-info/arm64
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/a1chess-arm64.apk
          echo "════════════════════ Build Complete ════════════════════"
          ls -lh build/app/outputs/flutter-apk/a1chess-arm64.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: A1Chess-arm64-APK
          path: build/app/outputs/flutter-apk/a1chess-arm64.apk
          retention-days: 30
          if-no-files-found: error

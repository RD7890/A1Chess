name: "A1 Chess — Compile › Sign › Release"

on:
  push:
    branches:
      - main
      - "release/**"
    paths-ignore:
      - "**.md"
      - ".github/workflows/crowdin*.yml"
      - "fastlane/**"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "prerelease"
        type: choice
        options: [prerelease, release]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_release:
    name: "Compile › Sign › Release"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-v1-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-v1-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v2-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-v2-

      - name: Disable Firebase symbol upload
        run: |
          {
            echo "com.google.firebase.crashlytics.mappingfileupload.enabled=false"
            echo "com.google.firebase.crashlytics.unstrippednativelibs.enabled=false"
          } >> android/gradle.properties

      - name: Install pub dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate signing keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/keystore.jks \
            -storetype JKS \
            -alias a1chess \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass a1chess2024 -keypass a1chess2024 \
            -dname "CN=A1Chess,OU=Mobile,O=Ryzix,L=City,ST=State,C=US"
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=a1chess2024"
            echo "keyAlias=a1chess"
            echo "keyPassword=a1chess2024"
          } > android/key.properties

      - name: Extract version from pubspec
        id: version
        run: |
          VER=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
          echo "name=$VER" >> "$GITHUB_OUTPUT"
          echo "Version → $VER (Build #${{ github.run_number }})"

      - name: Build arm64-v8a APK
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --obfuscate \
            --split-debug-info=build/debug-info/arm64

      - name: Rename and report APK size
        id: apkname
        run: |
          VER=${{ steps.version.outputs.name }}
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/a1chess-v${VER}-arm64.apk
          echo "════════ Final APK size ════════"
          ls -lh build/app/outputs/flutter-apk/a1chess-v${VER}-arm64.apk

      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.name }}-build.${{ github.run_number }}
          name: "A1 Chess v${{ steps.version.outputs.name }} (Build #${{ github.run_number }})"
          body: |
            ## A1 Chess v${{ steps.version.outputs.name }}

            > arm64-v8a only · R8 minified · obfuscated · Stockfish via multistockfish

            ### Download
            | APK | Arch | Notes |
            |-----|------|-------|
            | `a1chess-*-arm64.apk` | arm64-v8a | ✅ All Android phones 2016+ |

            ### Build info
            - **Branch:** `${{ github.ref_name }}`
            - **Commit:** `${{ github.sha }}`
          draft: false
          prerelease: ${{ github.event.inputs.release_type != 'release' }}
          files: build/app/outputs/flutter-apk/a1chess-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: "A1 Chess — Compile › Sign › Release"

on:
  push:
    branches:
      - main
      - "release/**"
    paths-ignore:
      - "**.md"
      - ".github/workflows/crowdin*.yml"
      - "fastlane/**"
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release type"
        required: true
        default: "prerelease"
        type: choice
        options: [prerelease, release]

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_release:
    name: "Compile › Sign › Release"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version-file: pubspec.yaml
          cache: true

      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: ${{ runner.os }}-pub-v1-${{ hashFiles('pubspec.lock') }}
          restore-keys: ${{ runner.os }}-pub-v1-

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-v2-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-v2-

      # ── Version bump ────────────────────────────────────────────────────
      - name: Bump build number
        id: bump
        run: |
          current=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          version_name=$(echo "$current" | cut -d'+' -f1)
          build_num=$(echo "$current" | cut -d'+' -f2)
          new_build=$(printf "%06d" $(( 10#$build_num + 1 )))
          new_version="${version_name}+${new_build}"
          sed -i "s/^version: .*/version: $new_version/" pubspec.yaml
          echo "version=$new_version"         >> "$GITHUB_OUTPUT"
          echo "version_name=$version_name"   >> "$GITHUB_OUTPUT"
          echo "Bumped: $current → $new_version"

      - name: Commit bumped version
        if: github.event_name != 'pull_request'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml
          git commit -m "chore: bump build number to ${{ steps.bump.outputs.version }} [skip ci]" || echo "Nothing to commit"
          git push

      # ── Build setup ─────────────────────────────────────────────────────
      - name: Disable Firebase symbol upload
        run: |
          {
            echo "com.google.firebase.crashlytics.mappingfileupload.enabled=false"
            echo "com.google.firebase.crashlytics.unstrippednativelibs.enabled=false"
          } >> android/gradle.properties

      - name: Install pub dependencies
        run: flutter pub get

      - name: Run code generation
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Generate signing keystore
        run: |
          keytool -genkey -v \
            -keystore android/app/keystore.jks \
            -storetype JKS \
            -alias a1chess \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass a1chess2024 -keypass a1chess2024 \
            -dname "CN=A1Chess,OU=Mobile,O=Ryzix,L=City,ST=State,C=US"
          {
            echo "storeFile=keystore.jks"
            echo "storePassword=a1chess2024"
            echo "keyAlias=a1chess"
            echo "keyPassword=a1chess2024"
          } > android/key.properties

      # ── Builds ──────────────────────────────────────────────────────────
      - name: Build arm64-v8a APK (Redmi 12C)
        run: |
          flutter build apk --release \
            --target-platform android-arm64 \
            --obfuscate \
            --split-debug-info=build/debug-info/arm64
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/a1chess-v${{ steps.bump.outputs.version_name }}-arm64.apk

      - name: Build armeabi-v7a APK (Poco C3)
        run: |
          flutter build apk --release \
            --target-platform android-arm \
            --obfuscate \
            --split-debug-info=build/debug-info/arm32
          cp build/app/outputs/flutter-apk/app-release.apk \
             build/app/outputs/flutter-apk/a1chess-v${{ steps.bump.outputs.version_name }}-arm32.apk

      - name: Report APK sizes
        run: |
          echo "════════ Final APK sizes ════════"
          ls -lh build/app/outputs/flutter-apk/a1chess-*.apk

      # ── Release ─────────────────────────────────────────────────────────
      - name: Create GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version_name }}-build.${{ github.run_number }}
          name: "A1 Chess v${{ steps.bump.outputs.version_name }} (Build #${{ github.run_number }})"
          body: |
            ## A1 Chess v${{ steps.bump.outputs.version_name }}

            > R8 minified · obfuscated · Stockfish via multistockfish

            ### Download
            | APK | Device | Architecture |
            |-----|--------|-------------|
            | `a1chess-*-arm64.apk` | **Redmi 12C** and most modern phones | arm64-v8a (64-bit) |
            | `a1chess-*-arm32.apk` | **Poco C3** and older devices | armeabi-v7a (32-bit) |

            ### Build info
            - **Branch:** `${{ github.ref_name }}`
            - **Commit:** `${{ github.sha }}`
          draft: false
          prerelease: ${{ github.event.inputs.release_type != 'release' }}
          files: build/app/outputs/flutter-apk/a1chess-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
